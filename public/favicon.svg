<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161f2c" />
      <stop offset="100%" stop-color="#0b0f17" />
    </linearGradient>
  </defs>
  <!-- Background squircle -->
  <rect width="32" height="32" rx="7" fill="url(#bgGrad)" />
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" fill="none" stroke="#22c55e" stroke-opacity="0.3" stroke-width="1" />
  
  <!-- Lightning bolt emblem -->
  <polygon points="17,6 7,17 16,17 15,26 25,15 16,15" fill="url(#boltGrad)" filter="drop-shadow(0 0 2px rgba(34,197,94,0.5))" />
</svg>
