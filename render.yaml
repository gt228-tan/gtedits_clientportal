services:
  - type: web
    name: gtclientportal-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    plan: free
    healthCheckPath: /
    envVars:
      - key: MONGO_URI
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        value: gtportal08@gmail.com
      - key: BREVO_SENDER_NAME
        value: GT Edits
      - key: ADMIN_EMAIL
        value: gtbtbhay22@gmail.com
      - key: CLIENT_URL
        value: https://gtedits-clientportal.vercel.app
      - key: GEMINI_API_KEY
        sync: false
      - key: SERVER_URL
        sync: false
